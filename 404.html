<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Page Not Found | Muneeb Ihsan</title>
  <link rel="icon" type="image/jpeg" href="assets/profile.jpg" />
  <style>
    :root{--bg:#0b0f14;--card:#141d26;--line:#263241;--text:#f5f7fa;--muted:#9aa8b6;--accent:#7cf0c6}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top right,rgba(124,240,198,.10),transparent 35%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .card{width:min(720px,100%);padding:48px;border:1px solid var(--line);border-radius:26px;background:var(--card);box-shadow:0 28px 90px rgba(0,0,0,.28)}
    .code{color:var(--accent);font-weight:900;letter-spacing:.12em;font-size:.82rem}
    h1{margin:12px 0 14px;font-size:clamp(2.4rem,7vw,5rem);line-height:1;letter-spacing:-.05em}
    p{color:var(--muted);font-size:1.05rem;line-height:1.7;margin:0}
    .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
    a{text-decoration:none;font-weight:800;padding:13px 18px;border-radius:12px;border:1px solid var(--line);color:var(--text)}
    a.primary{background:var(--accent);color:#08110e;border-color:transparent}
    @media(max-width:600px){.card{padding:30px}.actions{flex-direction:column}.actions a{text-align:center}}
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404 • PAGE NOT FOUND</div>
    <h1>Looks like this page escaped the level.</h1>
    <p>The page you opened does not exist or may have moved. You can return to my portfolio, jump straight to the projects section, or contact me on WhatsApp.</p>
    <div class="actions">
      <a class="primary" href="/">Back to Portfolio</a>
      <a href="/#work">View Projects</a>
      <a href="https://wa.me/923364570926" target="_blank" rel="noopener">WhatsApp</a>
    </div>
  </main>
</body>
</html>
